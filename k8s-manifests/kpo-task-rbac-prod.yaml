apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dap3-kubernetes-pod-operator
  namespace: airflow-prod-namespace
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dap3-kubernetes-pod-operator
  namespace: airflow-prod-namespace
subjects:
  - kind: ServiceAccount
    name: dap3-prod-airflow-worker
    namespace: airflow-prod-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dap3-kubernetes-pod-operator
