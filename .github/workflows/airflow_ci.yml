name: airflow_ci
on:
  pull_request:
    branches:
      - main
      - release-airflow-prod-branch
  workflow_call:
permissions:
  contents: read
jobs:
  validate-dags:
    runs-on: ubuntu-latest
    container:
      image: apache/airflow:3.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate YAML files (pod_templates and dag_config)
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          base = Path("extract_and_load/airflow/dags")
          yaml_files = list(base.rglob("*.yml")) + list(base.rglob("*.yaml"))
          for p in yaml_files:
              with p.open("r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"YAML OK: {p}")
          PY
      - name: Parse DAGs with DagBag
        run: |
          python - <<'PY'
          from airflow.models import DagBag
          dag_bag = DagBag(
              dag_folder="extract_and_load/airflow/dags",
              include_examples=False,
          )
          if dag_bag.import_errors:
              raise SystemExit(f"DAG import errors: {dag_bag.import_errors}")
          if "tag_sync_demo" not in dag_bag.dags:
              raise SystemExit("tag_sync_demo was not found")
          print("DAG parse passed:", sorted(dag_bag.dags.keys()))
          PY
